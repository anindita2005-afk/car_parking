version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: parking_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build: ../backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/parking_db
      - REDIS_URL=redis://redis:6379/0

  cv-engine:
    build: ../cv-engine
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_API_URL=http://backend:8000/api



volumes:
  pgdata:
  redisdata:
